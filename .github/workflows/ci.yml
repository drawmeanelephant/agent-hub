name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every JS file
        run: |
          fail=0
          for f in collector/*.js themes/hub/assets/js/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail
      - name: bash -n shell scripts
        run: bash -n start.sh stop.sh
      - name: config JSON parses
        run: node -e 'JSON.parse(require("fs").readFileSync("collector/config.json", "utf8"))'

  collector-smoke:
    name: collector-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: boot the collector and exercise the API
        run: |
          set -e
          node collector/server.js > collector.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8801/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8801/api/health >/dev/null

          TOKEN=$(cat .runtime/upload-token)
          auth="Authorization: Bearer $TOKEN"

          # post lands, feed advertises it
          curl -sf -H "$auth" -H "X-Agent: ci" -H "X-Kind: note" \
            --data-binary $'# ci smoke\n\nhello from CI' \
            "http://127.0.0.1:8801/api/posts?title=CI%20smoke&slug=ci-smoke&overwrite=1" | grep -q '"ok": true'
          curl -sf "http://127.0.0.1:8801/api/feed?agent=ci" | grep -q ci-smoke

          # image upload lands and is listed
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > /tmp/px.png
          curl -sf -H "$auth" --data-binary @/tmp/px.png \
            "http://127.0.0.1:8801/api/images?name=px.png&post=ci-media" | grep -q '"ok": true'
          curl -sf "http://127.0.0.1:8801/api/images" | grep -q px.png

          # SVG scripts get scrubbed on arrival
          printf '<svg xmlns="http://www.w3.org/2000/svg" onload="alert(1)"><script>alert(2)</script><circle r="4"/></svg>' > /tmp/evil.svg
          curl -sf -H "$auth" --data-binary @/tmp/evil.svg \
            "http://127.0.0.1:8801/api/images?name=evil.svg&post=ci-media" >/dev/null
          grep -q 'onload' content/posts/ci-media.assets/evil.svg && { echo "FAIL: svg onload survived"; exit 1; } || true
          grep -q '<script' content/posts/ci-media.assets/evil.svg && { echo "FAIL: svg <script> survived"; exit 1; } || true

          # non-images rejected 415, unauthenticated deletes rejected 401
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "$auth" --data-binary "nope" "http://127.0.0.1:8801/api/images?name=evil.txt")
          [ "$code" = "415" ] || { echo "FAIL: .txt upload -> $code (want 415)"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://127.0.0.1:8801/api/posts/ci-smoke")
          [ "$code" = "401" ] || { echo "FAIL: unauthenticated delete -> $code (want 401)"; exit 1; }

          # questions-for-humans round trip
          curl -sf -H "$auth" -H "Content-Type: application/json" \
            -d '{"question":"ci?","context":"smoke"}' http://127.0.0.1:8801/api/questions | grep -q '"ok": true'
          QID=$(curl -s "http://127.0.0.1:8801/api/questions" | grep -o 'q-[a-z0-9-]*' | head -1)
          curl -sf -H "$auth" -H "Content-Type: application/json" \
            -d '{"answer":"yes"}' "http://127.0.0.1:8801/api/questions/$QID/answer" | grep -q '"status": "answered"'

          # mojibake + control chars in agent input can never break the build:
          # C1 chars get healed (latin1->utf8), the rest stripped. (Raw control
          # bytes can't ride in headers — HTTP rejects them before Node — so
          # the title-strip path is tested via a query param. The sweep skips
          # NUL: grep patterns can't contain it, and boris-build catches it.)
          curl -sf -H "$auth" -H "X-Agent: ci" -H $'X-Title: ci \xe2\x80\x94 mojibake test' \
            --data-binary $'body with an \x0b embedded control char' \
            "http://127.0.0.1:8801/api/posts?slug=ci-mojibake&overwrite=1" >/dev/null
          grep -q $'\xe2\x80\x94' content/posts/ci-mojibake.md || { echo "FAIL: em-dash not healed"; exit 1; }
          # sweep by CODEPOINT, not bytes: a valid UTF-8 em-dash contains
          # continuation bytes 0x80/0x94, which are legal — only decoded C1
          # codepoints are poison (this is what Boris validates)
          node -e 'const s = require("fs").readFileSync("content/posts/ci-mojibake.md", "utf8");
            const m = s.match(/[\u0001-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f]/g);
            if (m) { console.log("FAIL: control chars:", m.map((c) => c.codePointAt(0).toString(16)).join(" ")); process.exit(1); }'
          # query title beats nothing: no X-Title header on this call, so the
          # control char in the query param must be stripped from the title
          curl -sf -H "$auth" -H "X-Agent: ci" \
            --data-binary "body two" \
            "http://127.0.0.1:8801/api/posts?slug=ci-mojibake&overwrite=1&title=broken%08title" >/dev/null
          grep -q 'title: "brokentitle"' content/posts/ci-mojibake.md || { echo "FAIL: query control char not stripped from title"; exit 1; }
          curl -sf -X DELETE -H "$auth" "http://127.0.0.1:8801/api/posts/ci-mojibake" >/dev/null

          # task board lifecycle: create → claim (pinned, no spoofing) →
          # double-claim 409 → third-party interference 409 → done with result
          TBIRD_TOKEN=$(node collector/tokens.js add smoketask | grep -o '[a-f0-9]\{40\}')
          INT_TOKEN=$(node collector/tokens.js add smokeintruder | grep -o '[a-f0-9]\{40\}')
          TID=$(curl -sf -H "$auth" -H "Content-Type: application/json" \
            -d '{"title":"ci smoke task","detail":"lifecycle check"}' \
            http://127.0.0.1:8801/api/tasks | grep -o 't-[a-z0-9-]*' | head -1)
          curl -sf -H "Authorization: Bearer $TBIRD_TOKEN" -X POST \
            "http://127.0.0.1:8801/api/tasks/$TID/claim" | grep -q '"claimedBy": "smoketask"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "$auth" -X POST \
            "http://127.0.0.1:8801/api/tasks/$TID/claim")
          [ "$code" = "409" ] || { echo "FAIL: double-claim -> $code (want 409)"; exit 1; }
          # a third party can neither release nor complete smoketask's claim
          # (the admin token may — by design — so it can't play the intruder here)
          for act in release done; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $INT_TOKEN" -X POST \
              "http://127.0.0.1:8801/api/tasks/$TID/$act")
            [ "$code" = "409" ] || { echo "FAIL: intruder $act -> $code (want 409)"; exit 1; }
          done
          curl -sf -H "Authorization: Bearer $TBIRD_TOKEN" -H "Content-Type: application/json" \
            -d '{"result":"verified"}' -X POST "http://127.0.0.1:8801/api/tasks/$TID/done" | grep -q '"status": "done"'

          # idea lab lifecycle: pitch → refine (agent) → spec post → attach →
          # graduate (admin only; agent 403) → auto-created task
          # (PITCH_ID, not PID — PID is the collector's process id above)
          PITCH_ID=$(curl -sf -H "$auth" -H "Content-Type: application/json" \
            -d '{"title":"ci smoke pitch","idea":"raw spitball"}' \
            http://127.0.0.1:8801/api/pitches | grep -o 'p-[a-z0-9-]*' | head -1)
          curl -sf -H "Authorization: Bearer $TBIRD_TOKEN" -X POST \
            "http://127.0.0.1:8801/api/pitches/$PITCH_ID/refine" | grep -q '"refinedBy": "smoketask"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TBIRD_TOKEN" -X POST \
            "http://127.0.0.1:8801/api/pitches/$PITCH_ID/graduate")
          [ "$code" = "403" ] || { echo "FAIL: agent graduate -> $code (want 403)"; exit 1; }
          curl -sf -H "$auth" -H "X-Kind: spec" --data-binary $'# ci spec\n\nacceptance: this line' \
            "http://127.0.0.1:8801/api/posts?slug=ci-spec&overwrite=1" >/dev/null
          curl -sf -H "$auth" -H "Content-Type: application/json" \
            -d '{"slug":"ci-spec"}' -X POST "http://127.0.0.1:8801/api/pitches/$PITCH_ID/spec" | grep -q '"status": "spec-ready"'
          curl -sf -H "$auth" -X POST "http://127.0.0.1:8801/api/pitches/$PITCH_ID/graduate" \
            | grep -q '"graduatedTo": "t-'
          curl -sf "http://127.0.0.1:8801/api/tasks?status=open" | grep -q 'implement: ci smoke pitch'

          # the token must never touch the log (we log paths only)
          if grep -q "$TOKEN" collector.log; then echo "FAIL: token leaked into collector.log"; exit 1; fi
          if grep -q "$TBIRD_TOKEN" collector.log; then echo "FAIL: agent token leaked into collector.log"; exit 1; fi
          if grep -q "$INT_TOKEN" collector.log; then echo "FAIL: intruder token leaked into collector.log"; exit 1; fi

          # cleanup
          curl -sf -X DELETE -H "$auth" "http://127.0.0.1:8801/api/posts/ci-smoke" >/dev/null
          curl -sf -X DELETE -H "$auth" "http://127.0.0.1:8801/api/posts/ci-spec" >/dev/null
          curl -sf -X DELETE -H "$auth" "http://127.0.0.1:8801/api/images?post=ci-media&name=px.png" >/dev/null
          curl -sf -X DELETE -H "$auth" "http://127.0.0.1:8801/api/images?post=ci-media&name=evil.svg" >/dev/null
          kill $PID
          echo "collector smoke: all assertions passed"

  boris-build:
    name: boris-build
    runs-on: macos-latest  # bin/boris is a pinned darwin/arm64 binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: generate runtime docs pages (the collector writes these at boot)
        run: node -e 'require("./collector/store").syncGeneratedDocs()'
      - name: pinned binary checksum (provenance)
        run: |
          SUM=$(shasum -a 256 bin/boris | cut -d' ' -f1)
          echo "boris sha256: $SUM" >> "$GITHUB_STEP_SUMMARY"
      - name: boris build (content + theme, strict validation)
        run: ./bin/boris build --input content --html-dir dist --theme themes/hub
      - name: dist sanity
        run: |
          test -f dist/index.html
          test -f dist/posts/index.html
          test -f dist/posts/2026-09-07-hello-fleet-example-post.html
          grep -q 'wordmark' dist/index.html
